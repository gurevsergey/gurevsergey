<text x="44" y="206" font-size="13" xml:space="preserve"><animate attributeName="opacity" values="0;1" keyTimes="0;0.1625" dur="16.0s" calcMode="discrete" repeatCount="indefinite"/><tspan fill="#7d8b99">mtcap: </tspan><tspan fill="#b4c0cb">home → 192.168.88.10, preset dns</tspan></text>
<text x="44" y="228" font-size="13" xml:space="preserve"><animate attributeName="opacity" values="0;1" keyTimes="0;0.1625" dur="16.0s" calcMode="discrete" repeatCount="indefinite"/><tspan fill="#7d8b99">       router sends: </tspan><tspan fill="#e8b88a">interface=bridge and port=53</tspan></text>
<text x="44" y="250" font-size="13" xml:space="preserve"><animate attributeName="opacity" values="0;1" keyTimes="0;0.2" dur="16.0s" calcMode="discrete" repeatCount="indefinite"/><tspan fill="#7d8b99">mtcap: </tspan><tspan fill="#b4c0cb">capturing from 192.168.88.1 on eth0 for up to 600 s; Ctrl-C to stop</tspan></text>
