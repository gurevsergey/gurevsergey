<text x="44" y="338" font-size="13" xml:space="preserve"><animate attributeName="opacity" values="0;1" keyTimes="0;0.5875" dur="16.0s" calcMode="discrete" repeatCount="indefinite"/><tspan fill="#7d8b99">10:15:09.301</tspan><tspan fill="#b4c0cb">            phone → home             </tspan><tspan fill="#5ec4d0">DNS</tspan><tspan fill="#e8b88a">     ? A     slow.example  no answer seen</tspan></text>
